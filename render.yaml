# Render Blueprint — backend (Express + Socket.IO)
# Render → New → Blueprint → энэ repo-г сонгоход автоматаар үүснэ.
services:
  - type: web
    name: noone-server
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "true"
      # Frontend (Vercel) хаяг(ууд), таслалаар. Custom домэйн нэмбэл энд нэмнэ.
      - key: CLIENT_ORIGIN
        value: https://noone-ten.vercel.app,http://localhost:5173
      # Vercel-ийн preview хаягуудыг (*.vercel.app) зөвшөөрөх
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: SERVE_CLIENT
        value: "false"
      # Унтахаас сэргийлэх: UB цагаар 08:00–02:00 хооронд 10 мин тутам өөр рүүгээ ping хийнэ
      - key: KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_HOURS
        value: "8-2"
      - key: REPORT_HASH_SALT
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # /admin хуудсанд нэвтрэх код (жишээ нь 5 оронтой тоо). Render-д гараар оруулна.
      - key: ADMIN_PASSWORD
        sync: false
      # Web Push хэрэгтэй бол `npm run vapid`-ээр үүсгээд нэмнэ (хоосон бол ажиллахгүй)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # Нууц ханыг байнга хадгалах (console.upstash.com → Redis → REST API)
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
